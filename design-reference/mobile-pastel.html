<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>파스텔톤 메인 화면 (모바일 390x844)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  .pb-row{display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #FFF3F7 0%, #F1F6FF 52%, #F2FFF6 100%); font-family: 'Gowun Dodum', sans-serif; color: #5B4B77; display: flex; flex-direction: column; padding: 30px 22px 22px; overflow: hidden;">

  <!-- header -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:18px;">
    <div style="width:74px; height:74px; border-radius:50%; background: linear-gradient(135deg,#FFD6E8,#C9E7FF); display:flex; align-items:center; justify-content:center; box-shadow: 0 8px 16px rgba(180,150,220,0.35);">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="#FFFFFF" stroke="#F7A8C4" stroke-width="1.5"/>
        <path d="M8 5.5C7 8 7 16 8 18.5" stroke="#F7A8C4" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M16 5.5C17 8 17 16 16 18.5" stroke="#F7A8C4" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="font-family:'Jua',sans-serif; font-size:11px; letter-spacing:2.5px; color:#B79CD6;">REALTIME NUMBER BASEBALL</div>
    <div style="font-family:'Jua',sans-serif; font-size:25px; color:#6B5490;">몽글몽글 홈런 야구</div>
  </div>

  <!-- profile card -->
  <div style="background:rgba(255,255,255,0.75); border-radius:20px; padding:14px 16px; display:flex; align-items:center; gap:13px; box-shadow: 0 6px 14px rgba(170,150,210,0.18); margin-bottom:16px;">
    <div style="width:46px;height:46px;border-radius:50%; background: linear-gradient(135deg,#FFE1A8,#FFC1DC); display:flex;align-items:center;justify-content:center; font-family:'Jua',sans-serif; font-size:18px; color:#8A6A9A; flex-shrink:0;">알</div>
    <div style="flex-grow:1; min-width:0;">
      <div class="pb-row" style="font-family:'Jua',sans-serif; font-size:15px; color:#5B4B77;">
        알쏭달쏭
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.121 2.121 0 0 0-3-3L5 17v3z" stroke="#C9AEDB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:12.5px; color:#9C8AB5; margin-top:3px;">전적 12승 3패 · 승률 80%</div>
    </div>
    <div class="pb-row" style="background:#FFF1B8; color:#B8860B; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; flex-shrink:0;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#D9A62B"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.9 5.9 20.5l1.5-6.8L2.2 9l6.9-.7L12 2z"/></svg>
      초보 홈런왕
    </div>
  </div>

  <!-- primary CTA -->
  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:9px; background: linear-gradient(90deg,#FFAFC4,#C6A6FF); color:#ffffff; font-family:'Jua',sans-serif; font-size:17px; padding:16px; border-radius:999px; box-shadow:0 8px 18px rgba(199,150,220,0.45); margin-bottom:11px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z" stroke="white" stroke-width="1.6"/><circle cx="12" cy="11" r="2.2" fill="white"/></svg>
    혼자 연습하기
  </button>

  <!-- secondary buttons -->
  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:10px; background:#F5FBFF; border:2px solid #BFE3FF; color:#5B87B0; font-family:'Jua',sans-serif; font-size:15px; padding:13px 16px; border-radius:18px; margin-bottom:10px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#6FA8D8" stroke-width="1.6"/><circle cx="12" cy="12" r="4.3" stroke="#6FA8D8" stroke-width="1.6"/><circle cx="12" cy="12" r="1.2" fill="#6FA8D8"/></svg>
    방 만들기 · QR 대전
  </button>

  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:10px; background:#FFF6FA; border:2px solid #FFD9EC; color:#C1709A; font-family:'Jua',sans-serif; font-size:15px; padding:13px 16px; border-radius:18px; margin-bottom:10px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M13 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" stroke="#D488AE" stroke-width="1.6" stroke-linecap="round"/><path d="M3 12h11m0 0-3.5-3.5M14 12l-3.5 3.5" stroke="#D488AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    QR 스캔으로 참가하기
  </button>

  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:10px; background:#FFFBEA; border:2px solid #FFE29A; color:#B8860B; font-family:'Jua',sans-serif; font-size:15px; padding:13px 16px; border-radius:18px; margin-bottom:16px;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z" stroke="#C79A2B" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke="#C79A2B" stroke-width="1.6" stroke-linecap="round"/><path d="M12 12v4m-3 3h6m-3-3v3" stroke="#C79A2B" stroke-width="1.6" stroke-linecap="round"/></svg>
    실시간 랭킹 보기
  </button>

  <!-- waiting rooms -->
  <div style="font-family:'Jua',sans-serif; font-size:13.5px; color:#8A7AA5; margin-bottom:9px;">지금 대기 중인 친구들</div>
  <div style="background:rgba(255,255,255,0.7); border-radius:18px; padding:6px 14px; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1.5px dashed #E7D9F0;">
      <div style="width:32px;height:32px;border-radius:50%; background:linear-gradient(135deg,#C9E7FF,#D9C9FF); flex-shrink:0;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:13.5px; color:#5B4B77;">홈런왕김자바</div>
        <div style="font-size:11px; color:#B3A5C7;">방코드 1234</div>
      </div>
      <div style="background:#D8F5E3; color:#4E9C72; font-family:'Jua',sans-serif; font-size:12px; padding:6px 14px; border-radius:999px; flex-shrink:0;">입장</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:11px 0;">
      <div style="width:32px;height:32px;border-radius:50%; background:linear-gradient(135deg,#FFE1C9,#FFC9DC); flex-shrink:0;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:13.5px; color:#5B4B77;">도토리수집가</div>
        <div style="font-size:11px; color:#B3A5C7;">방코드 5821</div>
      </div>
      <div style="background:#D8F5E3; color:#4E9C72; font-family:'Jua',sans-serif; font-size:12px; padding:6px 14px; border-radius:999px; flex-shrink:0;">입장</div>
    </div>
  </div>

</div>
</body>
</html>
