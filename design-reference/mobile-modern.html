<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모던 클린 메인 화면 (모바일 390x844)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  .mb-row{display:flex;align-items:center;}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAFB; font-family: 'Noto Sans KR', sans-serif; color: #16171B; display: flex; flex-direction: column; padding: 32px 24px 24px; overflow: hidden;">

  <!-- header -->
  <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:22px;">
    <div class="mb-row" style="gap:8px; margin-bottom:10px;">
      <div style="width:30px; height:30px; border-radius:9px; background:#111114; display:flex; align-items:center; justify-content:center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3 L20 8 L20 16 L12 21 L4 16 L4 8 Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="#FFFFFF"/></svg>
      </div>
      <div style="font-size:11px; font-weight:700; letter-spacing:1.5px; color:#8A8A93;">NUMBER BASEBALL</div>
    </div>
    <div style="font-size:26px; font-weight:900; letter-spacing:-0.5px;">홈런 숫자야구</div>
    <div style="font-size:13px; color:#8A8A93; margin-top:2px;">로그인 없이, 지금 바로 대결 시작</div>
  </div>

  <!-- profile card -->
  <div class="mb-row" style="background:#FFFFFF; border:1px solid #EAEAEC; border-radius:16px; padding:14px 16px; gap:12px; margin-bottom:20px;">
    <div class="mb-row" style="width:42px;height:42px;border-radius:50%; background:#111114; justify-content:center; font-size:14px; font-weight:700; color:#FFFFFF; flex-shrink:0;">알쏭</div>
    <div style="flex-grow:1; min-width:0;">
      <div class="mb-row" style="gap:5px; font-size:14.5px; font-weight:700;">
        알쏭달쏭
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.121 2.121 0 0 0-3-3L5 17v3z" stroke="#B3B3BA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:12px; color:#8A8A93; margin-top:3px;">12승 3패 · 승률 80%</div>
    </div>
    <div style="font-size:11px; font-weight:700; color:#4F46E5; background:#EEF0FF; padding:5px 10px; border-radius:8px; flex-shrink:0;">랭킹 4위</div>
  </div>

  <!-- primary CTA -->
  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%;" class="mb-row">
    <span class="mb-row" style="width:100%; justify-content:center; gap:9px; background:#111114; color:#FFFFFF; font-size:15.5px; font-weight:700; padding:16px; border-radius:14px; margin-bottom:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z" stroke="white" stroke-width="1.7"/><circle cx="12" cy="11" r="2.1" fill="white"/></svg>
      혼자 연습하기
    </span>
  </button>

  <!-- secondary buttons -->
  <div class="mb-row" style="gap:10px; margin-bottom:10px;">
    <button style="all:unset; box-sizing:border-box; cursor:pointer; flex:1;">
      <span style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:#FFFFFF; border:1px solid #EAEAEC; padding:14px; border-radius:14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#4F46E5" stroke-width="1.7"/><circle cx="12" cy="12" r="4.2" stroke="#4F46E5" stroke-width="1.7"/><circle cx="12" cy="12" r="1.1" fill="#4F46E5"/></svg>
        <span style="font-size:13.5px; font-weight:700; color:#16171B;">방 만들기</span>
        <span style="font-size:11px; color:#8A8A93;">QR 1:1 대전</span>
      </span>
    </button>
    <button style="all:unset; box-sizing:border-box; cursor:pointer; flex:1;">
      <span style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:#FFFFFF; border:1px solid #EAEAEC; padding:14px; border-radius:14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/><path d="M3 12h11m0 0-3.5-3.5M14 12l-3.5 3.5" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:13.5px; font-weight:700; color:#16171B;">참가하기</span>
        <span style="font-size:11px; color:#8A8A93;">QR 스캔 / 코드</span>
      </span>
    </button>
  </div>

  <button style="all:unset; box-sizing:border-box; cursor:pointer; width:100%; margin-bottom:20px;">
    <span class="mb-row" style="width:100%; gap:10px; background:#FFFFFF; border:1px solid #EAEAEC; color:#16171B; font-size:14px; font-weight:700; padding:13px 16px; border-radius:14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z" stroke="#4F46E5" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12v4m-3 3h6m-3-3v3" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/></svg>
      실시간 랭킹
      <span style="margin-left:auto; color:#B3B3BA; font-weight:400;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#B3B3BA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </span>
  </button>

  <!-- waiting rooms -->
  <div class="mb-row" style="justify-content:space-between; margin-bottom:10px;">
    <span style="font-size:13px; font-weight:700; color:#8A8A93;">대기 중인 공개방</span>
    <span style="font-size:12px; color:#4F46E5; font-weight:700;">전체보기</span>
  </div>
  <div style="background:#FFFFFF; border:1px solid #EAEAEC; border-radius:16px; padding:4px 16px;">
    <div class="mb-row" style="gap:11px; padding:13px 0; border-bottom:1px solid #F1F1F3;">
      <div style="width:30px;height:30px;border-radius:9px; background:#F1F1F3; flex-shrink:0;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:13.5px; font-weight:600;">홈런왕김자바</div>
        <div style="font-size:11px; color:#B3B3BA;">#1234</div>
      </div>
      <span style="font-size:12px; font-weight:700; color:#4F46E5; border:1px solid #DCDEFF; padding:6px 13px; border-radius:8px; flex-shrink:0;">입장</span>
    </div>
    <div class="mb-row" style="gap:11px; padding:13px 0;">
      <div style="width:30px;height:30px;border-radius:9px; background:#F1F1F3; flex-shrink:0;"></div>
      <div style="flex-grow:1; min-width:0;">
        <div style="font-size:13.5px; font-weight:600;">도토리수집가</div>
        <div style="font-size:11px; color:#B3B3BA;">#5821</div>
      </div>
      <span style="font-size:12px; font-weight:700; color:#4F46E5; border:1px solid #DCDEFF; padding:6px 13px; border-radius:8px; flex-shrink:0;">입장</span>
    </div>
  </div>

</div>
</body>
</html>
